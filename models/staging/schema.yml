version: 2

models:
  - name: stg_tea_staar_performance
    description: "Cleaned and renamed TEA STAAR performance data for Edinburg CISD, McAllen ISD, and Region One ESC, 2018-2025"
    columns:
      - name: district_name
        description: "District or organization name"
        tests:
          - not_null
      - name: district_id
        description: "TEA district ID"
        tests:
          - not_null
      - name: test_year
        description: "School year of STAAR administration"
        tests:
          - not_null
      - name: grade
        description: "Tested grade level"
        tests:
          - not_null

  - name: stg_edreports_curriculum_ratings
    description: "Cleaned edReports curriculum quality ratings with numeric score derived from text rating"
    columns:
      - name: district_name
        description: "District name matching STAAR data"
        tests:
          - not_null
      - name: curriculum_name
        description: "Name of the curriculum"
        tests:
          - not_null
      - name: subject
        description: "Subject area: Math or ELA"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Math', 'ELA']
      - name: overall_rating
        description: "edReports overall rating text"
        tests:
          - not_null
      - name: overall_rating_score
        description: "Numeric score derived from overall rating: 3=Meets, 2=Partially Meets, 1=Does Not Meet, 0=Not Reviewed"
        tests:
          - not_null